[project]
name = "xiaoya-speech"
version = "0.1.0"
description = "本地语音模型的 OpenAI 兼容服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=15,<16",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "fastapi==0.115.6",
    "gdown==5.1.0",
    "huggingface-hub>=0.34,<1",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib>=3.8,<4",
    "modelscope==1.20.0",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnxruntime>=1.22,<2",
    "openai-whisper>=20250625",
    "opencv-python-headless==4.11.0.86",
    "pyarrow==18.1.0",
    "python-multipart>=0.0.20,<1",
    "pyworld>=0.3.5",
    "rich==13.7.1",
    "setuptools==79.0.1",
    "sherpa-onnx==1.12.40",
    "sherpa-onnx-core==1.12.40",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.1",
    "uvicorn[standard]>=0.34,<1",
    "vllm==0.11.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "wetext==0.0.4",
    "wget==3.2",
    "x-transformers==2.11.24",
]

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv.sources]
torch = [
    # 本机 Python 3.12 的大轮子从镜像获取；uv.lock 校验与官方轮子一致的 SHA-256。
    { url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/torch-2.8.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/torchaudio-2.8.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_speech"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
