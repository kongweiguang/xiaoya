[project]
name = "xiaoya"
version = "0.1.0"
description = "基于 LiveKit Agents 和 DDD 的中文语音助手"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.12,<4",
    "livekit-agents[mcp,openai,silero]~=1.8.4",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
]

[project.scripts]
xiaoya = "xiaoya.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaoya"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# 中文注释使用中文句号；函数注释覆盖率另由架构测试检查。
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D400", "D415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "fastapi==0.115.6",
    "pillow>=12.3.0",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "python-multipart>=0.0.20,<1",
    "ruff>=0.14,<1",
]
